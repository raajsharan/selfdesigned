# Reverse proxy with TLS in front of the backend (the backend also serves the compiled UI on :4000).
# Set TRUST_PROXY=1 in backend/.env when using it, so rate limiting and the audit log see the real client address.
# Keep the backend itself bound to the machine (firewall port 4000 from outside) so everything goes through here.
server_tokens off;

server {
    listen 80;
    server_name your.domain.com;
    return 301 https://$host$request_uri;      # never serve the app, tokens or passwords over plain HTTP
}

server {
    listen 443 ssl http2;
    server_name your.domain.com;

    # Certificates, for example from certbot (certbot --nginx -d your.domain.com).
    ssl_certificate     /etc/letsencrypt/live/your.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50m;          # Excel imports, Tenable files and CSV restores

    # Never serve hidden files or version-control data, whatever sits behind the proxy.
    location ~ /\.(?!well-known/) { deny all; return 404; }
    location ~* \.(env|bak|sql|dump|log|map)$ { deny all; return 404; }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;       # overwrite, do not append: clients cannot forge their address
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;       # discovery runs can take a while on large estates
    }
}
