# Optional reverse proxy. The backend already serves the compiled UI on :4000, so nginx is only
# needed for TLS termination. Set TRUST_PROXY=1 in backend/.env when using it.
server {
    listen 80;
    server_name your.domain.com;
    # After running certbot this block is replaced by a redirect to https.

    client_max_body_size 50m;          # Excel imports, Tenable files and CSV restores

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;       # discovery runs can take a while on large estates
    }
}
