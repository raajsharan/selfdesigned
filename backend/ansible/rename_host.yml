# Rename one host. Driven by backend/src/services/hostnameRenameService.js (inventory = a single host named "target").
#   new_hostname   the name to set
#   rename_reboot  true = reboot when the OS says the new name needs one (Windows); a Linux hostname takes effect without a reboot
# Linux is reached over SSH with sudo, Windows over SSH (OpenSSH Server, PowerShell shell). The last task prints
#   HOSTNAME_RESULT|present||changed=<yes|no>;reboot=<needed|notneeded>;rebooted=<yes|no>

- name: Rename a Linux host
  hosts: linux
  gather_facts: false
  become: true
  tasks:
    - name: Set the hostname
      ansible.builtin.hostname:
        name: "{{ new_hostname }}"
      register: renamed
    - name: Restart systemd-hostnamed so it reports the new name
      ansible.builtin.systemd:
        name: systemd-hostnamed
        state: restarted
      when: renamed.changed
      failed_when: false
    - name: Report
      ansible.builtin.debug:
        msg: "HOSTNAME_RESULT|present||changed={{ 'yes' if renamed.changed else 'no' }};reboot=notneeded;rebooted=no"

- name: Rename a Windows host
  hosts: windows
  gather_facts: false
  tasks:
    - name: Set the computer name
      ansible.windows.win_hostname:
        name: "{{ new_hostname }}"
      register: renamed
    - name: Reboot, because Windows needs it for the new name and a reboot is allowed
      ansible.windows.win_reboot:
        reboot_timeout: 900
      when: renamed.reboot_required | default(false) and rename_reboot | bool
    - name: Report
      ansible.builtin.debug:
        msg: "HOSTNAME_RESULT|present||changed={{ 'yes' if renamed.changed else 'no' }};reboot={{ 'needed' if renamed.reboot_required | default(false) else 'notneeded' }};rebooted={{ 'yes' if (renamed.reboot_required | default(false) and rename_reboot | bool) else 'no' }}"
